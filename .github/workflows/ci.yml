# 在主分支和开发分支的 push/PR 上执行后端与前端构建、测试与覆盖率检查。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algolift
          POSTGRES_PASSWORD: algolift
          POSTGRES_DB: algolift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algolift -d algolift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://algolift:algolift@localhost:5432/algolift_test
      JWT_SECRET: ci-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Sync app version from latest git tag
        run: |
          VITE_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          if [ -n "$VITE_TAG" ]; then
            VITE_APP_VERSION="$(printf '%s' "$VITE_TAG" | sed 's/^v//')"
            printf 'VITE_APP_VERSION=%s' "$VITE_APP_VERSION" > .env.production
            printf 'VITE_APP_VERSION=%s' "$VITE_APP_VERSION" > .env.development
            echo "synced app version to $VITE_APP_VERSION"
          else
            echo "no semver git tag found, keeping committed VITE_APP_VERSION"
          fi

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage
